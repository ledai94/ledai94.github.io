<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Mock menu website (child)</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #fafafa; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { border: 3px solid #ddd; border-radius: 8px; background: #fff; padding: 6px; text-align: center; cursor: pointer; }
  .card.selected { border-color: #e60012; }
  .card .img { height: 90px; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #888; }
  .card img { max-width: 100%; max-height: 90px; }
  .row { margin: 12px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input { padding: 6px; font-size: 14px; }
  button { padding: 10px 24px; font-size: 16px; }
  #log { background: #222; color: #9f9; font: 12px monospace; padding: 8px; height: 140px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>メニューを選択してください</h1>
<div id="grid" class="grid"></div>

<div class="row">
  image: <input id="image" size="22">
  <button id="submitBtn" type="button">Submit</button>
</div>
<div id="log"></div>
<script>
  // Target origin of the parent (the app) is passed via ?parentOrigin=
  // Fallbacks (test harness only): ancestorOrigins, then '*' so a missing/mismatched param never drops the message silently
  var parentOrigin = new URLSearchParams(location.search).get('parentOrigin') ||
    (location.ancestorOrigins && location.ancestorOrigins[0]) || '*';
  console.log('[menu] parentOrigin =', parentOrigin, 'inIframe =', window.parent !== window);

  var MENUS = [
    { name: 'Menu 1001', image: '1001.png' },
    { name: 'Menu 1002', image: '1002.png' },
    { name: 'Menu 1003', image: '1003.png' }
  ];

  var logEl = document.getElementById('log');
  function log(msg) {
    logEl.textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  var grid = document.getElementById('grid');
  MENUS.forEach(function (m) {
    var d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<div class="img"><img alt="' + m.image + '" src="' + m.image + '" onerror="this.remove()"></div>' +
                  '<div>' + m.name + '</div><small>' + m.image + '</small>';
    d.onclick = function () {
      [].forEach.call(document.querySelectorAll('.card'), function (c) { c.classList.remove('selected'); });
      d.classList.add('selected');
      document.getElementById('image').value = m.image;
    };
    grid.appendChild(d);
  });

  /** Posts the selected image to the parent window, restricted to parentOrigin. */
  document.getElementById('submitBtn').onclick = function () {
    var image = document.getElementById('image').value.trim();
    if (!image) { log('select a menu first'); return; }
    var msg = { image: image };
    window.parent.postMessage(msg, parentOrigin);
    log('postMessage -> ' + parentOrigin + ' ' + JSON.stringify(msg));
  };

  // Submit is only useful when this page is framed; hide it when opened directly.
  document.getElementById('submitBtn').hidden = window.self === window.top;
</script>
</body>
</html>
