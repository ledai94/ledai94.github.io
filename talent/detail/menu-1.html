<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Menu 1001</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #fafafa; text-align: center; }
  img { max-width: 100%; max-height: 300px; }
  button { padding: 10px 24px; font-size: 16px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Menu 1001</h1>
<img src="../1001.webp" alt="1001.webp">
<div><button id="submitBtn" type="button">Submit</button></div>
<div><a id="back" href="../list.html">&larr; Back</a></div>
<script>
  var IMAGE = '1001.webp';
  var parentOrigin = new URLSearchParams(location.search).get('parentOrigin') ||
    (location.ancestorOrigins && location.ancestorOrigins[0]) || '*';

  document.getElementById('back').href = '../list.html' + location.search;

  document.getElementById('submitBtn').onclick = function () {
    window.parent.postMessage({ image: IMAGE }, parentOrigin);
  };

  document.getElementById('submitBtn').hidden = window.self === window.top;
</script>
</body>
</html>
